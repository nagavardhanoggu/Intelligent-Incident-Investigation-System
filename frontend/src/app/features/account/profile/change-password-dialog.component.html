<section class="dialog-shell">
  <header class="dialog-header">
    <span class="header-icon">
      <mat-icon>lock_reset</mat-icon>
    </span>
    <div class="header-copy">
      <h2>Change Password</h2>
      <p>Update the password used to sign in to your account.</p>
    </div>
    <button mat-icon-button type="button" class="close-button" aria-label="Close dialog" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <mat-dialog-content class="dialog-body">
    <form [formGroup]="form">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" floatLabel="always">
        <mat-label>Current Password</mat-label>
        <input matInput formControlName="currentPassword" [type]="hideCurrentPassword() ? 'password' : 'text'" autocomplete="current-password" />
        <button mat-icon-button matSuffix type="button" aria-label="Toggle current password visibility" (click)="hideCurrentPassword.set(!hideCurrentPassword())">
          <mat-icon>{{ hideCurrentPassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic" floatLabel="always">
        <mat-label>New Password</mat-label>
        <input matInput formControlName="newPassword" [type]="hideNewPassword() ? 'password' : 'text'" autocomplete="new-password" />
        <button mat-icon-button matSuffix type="button" aria-label="Toggle new password visibility" (click)="hideNewPassword.set(!hideNewPassword())">
          <mat-icon>{{ hideNewPassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic" floatLabel="always">
        <mat-label>Confirm New Password</mat-label>
        <input matInput formControlName="confirmPassword" [type]="hideConfirmPassword() ? 'password' : 'text'" autocomplete="new-password" />
        <button mat-icon-button matSuffix type="button" aria-label="Toggle confirm password visibility" (click)="hideConfirmPassword.set(!hideConfirmPassword())">
          <mat-icon>{{ hideConfirmPassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
      </mat-form-field>

      @if (passwordMismatch()) {
        <p class="form-error">New password and confirmation do not match.</p>
      }
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-footer">
    <button mat-button type="button" (click)="close()">Cancel</button>
    <button mat-flat-button type="button" (click)="save()">
      <mat-icon>lock_reset</mat-icon>
      Change Password
    </button>
  </mat-dialog-actions>
</section>
