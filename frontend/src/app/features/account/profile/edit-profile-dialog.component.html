<section class="dialog-shell">
  <header class="dialog-header">
    <span class="header-icon">
      <mat-icon>edit</mat-icon>
    </span>
    <div class="header-copy">
      <h2>Edit Profile</h2>
      <p>Update your account name and email address.</p>
    </div>
    <button mat-icon-button type="button" class="close-button" aria-label="Close dialog" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <mat-dialog-content class="dialog-body">
    <form [formGroup]="form">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" floatLabel="always">
        <mat-label>Full Name</mat-label>
        <input matInput formControlName="fullName" />
      </mat-form-field>
      <mat-form-field appearance="outline" subscriptSizing="dynamic" floatLabel="always">
        <mat-label>Email Address</mat-label>
        <input matInput formControlName="email" />
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-footer">
    <button mat-button type="button" (click)="close()">Cancel</button>
    <button mat-flat-button type="button" (click)="save()">
      <mat-icon>save</mat-icon>
      Save Changes
    </button>
  </mat-dialog-actions>
</section>
